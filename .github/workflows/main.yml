name: 🐍 Gerar cobrinha de contribuições

on:
  # roda automaticamente a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  # permite rodar manualmente pela aba Actions
  workflow_dispatch:

  # roda a cada push na branch principal
  push:
    branches:
      - main

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # gera a animação da cobrinha a partir do grid de contribuições do usuário
      # versões clara e escura com a paleta azul do perfil (#00A6FF)
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#00A6FF&color_dots=#ebedf0,#c6e6ff,#79c0ff,#2f81f7,#0550ae
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00A6FF&color_dots=#161b22,#0a3069,#0969da,#2f81f7,#58a6ff

      # publica os arquivos na branch "output"
      # ficam disponíveis em https://raw.githubusercontent.com/<usuario>/<repo>/output/<arquivo>
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
