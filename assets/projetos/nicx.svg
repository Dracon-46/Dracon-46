<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Nicx — A IA da Falkyria, morando no seu computador.">
  <title>Nicx — A IA da Falkyria, morando no seu computador.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".35" r=".55">
      <stop offset="0" stop-color="#46e3f5" stop-opacity=".28"/>
      <stop offset="1" stop-color="#46e3f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#46e3f5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#46e3f5"/>
      <stop offset="1" stop-color="#46e3f5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect width="880" height="240" rx="18"/></clipPath>
  </defs>
  <style>
    .kicker { font: 700 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; fill: #46e3f5; }
    .name { font: 800 46px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
    .tag { font: 400 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; }
    .chip { font: 600 12.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
    .status { font: 600 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #46e3f5; }
    .brand { font: 700 11px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; letter-spacing: 4px; fill: #8b949e; }
    .glow { animation: pulse 6s ease-in-out infinite; }
    .scan { animation: scan 7s linear infinite; }
    .big { animation: float 8s ease-in-out infinite; transform-origin: 12px 12px; transform-box: view-box; }
    .dot { animation: blink 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .65 } 50% { opacity: 1 } }
    @keyframes scan { from { transform: translateX(-880px) } to { transform: translateX(880px) } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-8deg) } 50% { transform: translateY(-1px) rotate(-4deg) } }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  </style>
  <g clip-path="url(#card)">
    <rect width="880" height="240" fill="url(#bg)"/>
    <rect width="880" height="240" fill="url(#dots)"/>
    <rect width="880" height="240" fill="url(#glow)" class="glow"/>
    <g opacity=".14" transform="translate(665,52) scale(7.5)"><g class="big"><g fill="none" stroke="#46e3f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2m16 0h2m-7-1v2m-6-2v2"/></g></g></g>
    <rect y="0" width="880" height="2" fill="url(#line)" class="scan"/>
  </g>
  <rect x=".5" y=".5" width="879" height="239" rx="17.5" fill="none" stroke="#46e3f5" stroke-opacity=".35"/>

  <g transform="translate(40,34)">
    <rect width="44" height="44" rx="12" fill="#46e3f5" fill-opacity=".1" stroke="#46e3f5" stroke-opacity=".5"/>
    <g transform="translate(10,10)"><g fill="none" stroke="#46e3f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2m16 0h2m-7-1v2m-6-2v2"/></g></g>
  </g>
  <text x="100" y="52" class="kicker">INTELIGÊNCIA ARTIFICIAL</text>
  <text x="100" y="72" class="brand">FALKYRIA</text>

  <text x="40" y="130" class="name">Nicx</text>
  <text x="40" y="160" class="tag">A IA da Falkyria, morando no seu computador.</text>

  <g transform="translate(604,34)">
    <rect width="236" height="26" rx="13" fill="#0d1117" stroke="#46e3f5" stroke-opacity=".5"/>
    <circle cx="15" cy="13" r="4" fill="#46e3f5" class="dot"/>
    <text x="26" y="17.5" class="status">Instalador para Windows em breve</text>
  </g>

  <g transform="translate(40,186)"><rect width="76" height="26" rx="13" fill="#46e3f5" fill-opacity=".08" stroke="#46e3f5" stroke-opacity=".35"/><text x="38" y="17.5" text-anchor="middle" class="chip">IA local</text></g><g transform="translate(124,186)"><rect width="75" height="26" rx="13" fill="#46e3f5" fill-opacity=".08" stroke="#46e3f5" stroke-opacity=".35"/><text x="38" y="17.5" text-anchor="middle" class="chip">React 19</text></g><g transform="translate(207,186)"><rect width="50" height="26" rx="13" fill="#46e3f5" fill-opacity=".08" stroke="#46e3f5" stroke-opacity=".35"/><text x="25" y="17.5" text-anchor="middle" class="chip">Vite</text></g><g transform="translate(266,186)"><rect width="89" height="26" rx="13" fill="#46e3f5" fill-opacity=".08" stroke="#46e3f5" stroke-opacity=".35"/><text x="44" y="17.5" text-anchor="middle" class="chip">Tailwind 4</text></g><g transform="translate(362,186)"><rect width="97" height="26" rx="13" fill="#46e3f5" fill-opacity=".08" stroke="#46e3f5" stroke-opacity=".35"/><text x="48" y="17.5" text-anchor="middle" class="chip">App Windows</text></g><g transform="translate(467,186)"><rect width="45" height="26" rx="13" fill="#46e3f5" fill-opacity=".08" stroke="#46e3f5" stroke-opacity=".35"/><text x="23" y="17.5" text-anchor="middle" class="chip">CLI</text></g>
</svg>
