<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Ascend — O RPG da sua vida real.">
  <title>Ascend — O RPG da sua vida real.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".35" r=".55">
      <stop offset="0" stop-color="#f5b733" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f5b733" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#f5b733" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f5b733"/>
      <stop offset="1" stop-color="#f5b733" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect width="880" height="240" rx="18"/></clipPath>
  </defs>
  <style>
    .kicker { font: 700 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; fill: #f5b733; }
    .name { font: 800 46px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
    .tag { font: 400 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; }
    .chip { font: 600 12.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
    .status { font: 600 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f5b733; }
    .brand { font: 700 11px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; letter-spacing: 4px; fill: #8b949e; }
    .glow { animation: pulse 6s ease-in-out infinite; }
    .scan { animation: scan 7s linear infinite; }
    .big { animation: float 8s ease-in-out infinite; transform-origin: 12px 12px; transform-box: view-box; }
    .dot { animation: blink 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .65 } 50% { opacity: 1 } }
    @keyframes scan { from { transform: translateX(-880px) } to { transform: translateX(880px) } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-8deg) } 50% { transform: translateY(-1px) rotate(-4deg) } }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  </style>
  <g clip-path="url(#card)">
    <rect width="880" height="240" fill="url(#bg)"/>
    <rect width="880" height="240" fill="url(#dots)"/>
    <rect width="880" height="240" fill="url(#glow)" class="glow"/>
    <g opacity=".14" transform="translate(665,52) scale(7.5)"><g class="big"><path fill="none" stroke="#f5b733" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m13 19l6-6m-4.5 4.5L3.586 6.586A2 2 0 0 1 3 5.172V3h2.172a2 2 0 0 1 1.414.586L17.5 14.5m-2.672-8.328l2.586-2.586A2 2 0 0 1 18.828 3H21v2.172a2 2 0 0 1-.586 1.414l-2.586 2.586M16 16l4 4m-1 1l2-2M5 14l4 4m-4 3l-2-2m4.5-2.5L4 20"/></g></g>
    <rect y="0" width="880" height="2" fill="url(#line)" class="scan"/>
  </g>
  <rect x=".5" y=".5" width="879" height="239" rx="17.5" fill="none" stroke="#f5b733" stroke-opacity=".35"/>

  <g transform="translate(40,34)">
    <rect width="44" height="44" rx="12" fill="#f5b733" fill-opacity=".1" stroke="#f5b733" stroke-opacity=".5"/>
    <g transform="translate(10,10)"><path fill="none" stroke="#f5b733" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m13 19l6-6m-4.5 4.5L3.586 6.586A2 2 0 0 1 3 5.172V3h2.172a2 2 0 0 1 1.414.586L17.5 14.5m-2.672-8.328l2.586-2.586A2 2 0 0 1 18.828 3H21v2.172a2 2 0 0 1-.586 1.414l-2.586 2.586M16 16l4 4m-1 1l2-2M5 14l4 4m-4 3l-2-2m4.5-2.5L4 20"/></g>
  </g>
  <text x="100" y="52" class="kicker">GAMIFICAÇÃO</text>
  <svg x="100" y="60" width="15" height="15" viewBox="40 0 480 500"><mask id="lg" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="600"><rect width="600" height="600" fill="#fff"/><g fill="#000"><polygon points="254.0,118.0 278.0,118.0 233.6,340.0 209.6,340.0"/><polygon points="254.0,118.0 560.0,35.4 560.0,59.4 254.0,142.0"/><polygon points="235.2,212.0 560.0,124.3 560.0,148.3 235.2,236.0"/></g></mask><path d="M54 198L58 160Q66 130 100 112Q120 102 150 96L205 100L300 74L400 42L504 14L486 58L492 84L452 150L460 178L410 232Q362 268 318 302Q284 336 272 392L238 494L184 412Q138 300 118 212L100 178Q84 166 70 176Z" fill="#ffffff" mask="url(#lg)"/><polygon points="118,130 158,120 148,139 124,142" fill="#f5b733"/></svg>
  <text x="121" y="72" class="brand">FALKYRIA</text>

  <text x="40" y="130" class="name">Ascend</text>
  <text x="40" y="160" class="tag">O RPG da sua vida real.</text>

  <g transform="translate(735,34)">
    <rect width="105" height="26" rx="13" fill="#0d1117" stroke="#f5b733" stroke-opacity=".5"/>
    <circle cx="15" cy="13" r="4" fill="#f5b733" class="dot"/>
    <text x="26" y="17.5" class="status">Em produção</text>
  </g>

  <g transform="translate(40,186)"><rect width="75" height="26" rx="13" fill="#f5b733" fill-opacity=".08" stroke="#f5b733" stroke-opacity=".35"/><text x="38" y="17.5" text-anchor="middle" class="chip">React 19</text></g><g transform="translate(123,186)"><rect width="92" height="26" rx="13" fill="#f5b733" fill-opacity=".08" stroke="#f5b733" stroke-opacity=".35"/><text x="46" y="17.5" text-anchor="middle" class="chip">TypeScript</text></g><g transform="translate(224,186)"><rect width="82" height="26" rx="13" fill="#f5b733" fill-opacity=".08" stroke="#f5b733" stroke-opacity=".35"/><text x="41" y="17.5" text-anchor="middle" class="chip">Fastify 5</text></g><g transform="translate(314,186)"><rect width="71" height="26" rx="13" fill="#f5b733" fill-opacity=".08" stroke="#f5b733" stroke-opacity=".35"/><text x="36" y="17.5" text-anchor="middle" class="chip">Drizzle</text></g><g transform="translate(393,186)"><rect width="112" height="26" rx="13" fill="#f5b733" fill-opacity=".08" stroke="#f5b733" stroke-opacity=".35"/><text x="56" y="17.5" text-anchor="middle" class="chip">PostgreSQL 16</text></g><g transform="translate(513,186)"><rect width="85" height="26" rx="13" fill="#f5b733" fill-opacity=".08" stroke="#f5b733" stroke-opacity=".35"/><text x="42" y="17.5" text-anchor="middle" class="chip">Capacitor</text></g><g transform="translate(606,186)"><rect width="92" height="26" rx="13" fill="#f5b733" fill-opacity=".08" stroke="#f5b733" stroke-opacity=".35"/><text x="46" y="17.5" text-anchor="middle" class="chip">Playwright</text></g>
</svg>
