  <g class="row" style="animation-delay:240ms"><g transform="translate(24,83) scale(0.6666666666666666)" fill="none" stroke="#00A6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7M6 9v12"/></g><text x="50" y="95" class="label">Pull requests</text><text x="246" y="95" class="value" text-anchor="end">67</text></g>
  <g class="row" style="animation-delay:330ms"><g transform="translate(24,110) scale(0.6666666666666666)" fill="none" stroke="#00A6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="12" r="10"/></g><text x="50" y="122" class="label">Issues</text><text x="246" y="122" class="value" text-anchor="end">10</text></g>
  <g class="row" style="animation-delay:420ms"><g transform="translate(24,137) scale(0.6666666666666666)" fill="none" stroke="#00A6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v8l3-3l3 3V2"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></g><text x="50" y="149" class="label">Repositórios</text><text x="246" y="149" class="value" text-anchor="end">21</text></g>
