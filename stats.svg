    .small { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
    .row { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px) } to { opacity: 1; transform: none } }
  </style>
  <rect width="440" height="232" rx="14" fill="url(#bg)"/>
  <rect width="440" height="232" rx="14" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="439" height="231" rx="13.5" fill="none" stroke="#00A6FF" stroke-opacity=".35"/>
  <g transform="translate(24,22) scale(0.75)" fill="none" stroke="#00A6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16m-3-4V9m-5 8V5M8 17v-3"/></g>
