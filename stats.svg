<svg xmlns="http://www.w3.org/2000/svg" width="440" height="232" viewBox="0 0 440 232" role="img" aria-label="Estatísticas no GitHub">
  <title>Estatísticas no GitHub</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#00A6FF" stop-opacity=".16"/><stop offset="1" stop-color="#00A6FF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
